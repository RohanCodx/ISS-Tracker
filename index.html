<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISS traker from RohanCodx</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --glow: #f5fbfc; --panel-bg: rgba(11, 13, 23, 0.95); }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .leaflet-marker-icon { transition: transform 1s linear !important; }
        #dashboard {
            position: absolute;
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(14, 21, 22, 0.3);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 15px;
            transition: all 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            #dashboard {
                bottom: 0; left: 0; right: 0;
                border-radius: 20px 20px 0 0;
                padding-bottom: env(safe-area-inset-bottom);
                max-height: 70vh;
                transform: translateY(100%);
            }
            #dashboard.open {
                transform: translateY(0);
            }
        }
        @media (min-width: 769px) {
            #dashboard {
                top: 20px; right: 20px;
                width: 280px;
                border-radius: 12px;
                grid-template-columns: 1fr;
            }
        }
        .stat-box { border-left: 2px solid var(--glow); padding-left: 10px; }
        .label { font-size: 10px; text-transform: uppercase; color: var(--glow); letter-spacing: 1px; }
        .value { font-size: 16px; font-weight: bold; font-family: monospace; }

        .iss-icon { font-size: 32px; filter: drop-shadow(0 0 8px var(--glow)); }

        #liveBtn {
            grid-column: span 2;
            background: rgba(245, 251, 252, 0.08);
            border: 1px solid rgba(245, 251, 252, 0.3);
            color: white;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }
        #liveBtn:hover { background: rgba(245, 251, 252, 0.16); }

        #liveWrap {
            grid-column: span 2;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            border-radius: 8px;
        }
        #liveWrap.open { max-height: 200px; }
        #liveInner { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
        #liveInner iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        #iss-timer {
            grid-column: span 2;
            font-size: 12px;
            line-height: 1.5;
            border-top: 1px solid rgba(245, 251, 252, 0.2);
            padding-top: 10px;
        }
        .leaflet-control-zoom {
            border: 1px solid rgba(245, 251, 252, 0.3) !important;
            border-radius: 8px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background: var(--panel-bg) !important;
            color: var(--glow) !important;
            border: none !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(245, 251, 252, 0.16) !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="dashboard">
        <div class="value">RohanCodx</div>
        <div class="stat-box" style="grid-column: span 2;">
            <div class="label">Current Position</div>
            <div class="value" id="coords">Calculating...</div>
        </div>
        <div class="stat-box">
            <div class="label">Velocity</div>
            <div class="value"><span id="speed">0</span> <small>km/h</small></div>
        </div>
        <div class="stat-box">
            <div class="label">Altitude</div>
            <div class="value"><span id="alt">0</span> <small>km</small></div>
        </div>
        <div class="stat-box" style="grid-column: span 2;">
            <div class="label">Visibility</div>
            <div class="value" id="visibility">---</div>
        </div>
        <div class="stat-box">
            <div class="label">Orbital Period</div>
            <div class="value"><span id="period">--</span> <small>min</small></div>
        </div>
        <div class="stat-box">
            <div class="label">Inclination</div>
            <div class="value"><span id="incl">--</span> <small>°</small></div>
        </div>
        <div class="stat-box">
            <div class="label">Orbits Today</div>
            <div class="value"><span id="orbits">--</span> <small>/day</small></div>
        </div>
        <div class="stat-box">
            <div class="label">Horizon Radius</div>
            <div class="value"><span id="footprint">--</span> <small>km</small></div>
        </div>

        <button id="liveBtn">Live View</button>
        <div id="liveWrap">
            <div id="liveInner"></div>
        </div>

        <div id="iss-timer">
          ISS Remaining Time: Loading...
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>

    <script>
        const map = L.map('map', {
            zoomControl: false,
            minZoom: window.innerWidth < 768 ? 3 : 2,
            maxBounds: [[-90, -180], [90, 180]],
            maxBoundsViscosity: 1.0
        }).setView([0, 0], 3);

        L.control.zoom({ position: 'topleft' }).addTo(map);

        // CARTO's free raster basemaps (basemaps.cartocdn.com) started requiring
        // an API key in late Aug 2026 — anonymous requests now render an
        // "API KEY REQUIRED" watermark instead of the tile. Esri's dark gray
        // canvas basemap is free and keyless, so we use that instead.
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            noWrap: true,
            bounds: [[-90, -180], [90, 180]],
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
        }).addTo(map);

        const predictLine = L.polyline([], {color: '#00e5ff', weight: 2, dashArray: '5, 10', opacity: 0.8}).addTo(map);
        const pastLine = L.polyline([], {color: '#ff9f43', weight: 2, dashArray: '2, 8', opacity: 0.6}).addTo(map);
        const issIcon = L.divIcon({ className: 'iss-icon', html: '🛰️', iconSize: [32, 32], iconAnchor: [16, 16] });
        let marker = L.marker([0, 0], {icon: issIcon}).addTo(map);
        let isFirstLoad = true;
        const EARTH_R = 6371;

        // Mobile: dashboard starts collapsed to a small handle bar.
        // Tapping the ISS marker toggles it open; tapping the map closes it.
        const dashboard = document.getElementById('dashboard');
        marker.on('click', (e) => {
            if (window.innerWidth < 768) {
                L.DomEvent.stopPropagation(e);
                dashboard.classList.toggle('open');
            }
        });
        map.on('click', () => {
            if (window.innerWidth < 768) {
                dashboard.classList.remove('open');
            }
        });

        function updatePrediction(tle1, tle2, currentLon) {
            const satrec = satellite.twoline2satrec(tle1, tle2);
            const now = new Date();

            // Forward (future) track
            const futurePoints = [];
            for (let i = 0; i < 90; i += 1) {
                const time = new Date(now.getTime() + i * 60000);
                const pos = satellite.propagate(satrec, time);
                if (!pos || !pos.position) continue;
                const gmst = satellite.gstime(time);
                const posGd = satellite.eciToGeodetic(pos.position, gmst);

                const lat = satellite.degreesLat(posGd.latitude);
                const lon = satellite.degreesLong(posGd.longitude);

                if (futurePoints.length > 0) {
                    const lastLon = futurePoints[futurePoints.length - 1][1];
                    if (Math.abs(lon - lastLon) > 100) break;
                }

                futurePoints.push([lat, lon]);
            }
            predictLine.setLatLngs(futurePoints);

            // Backward (past) track — where the ISS has already flown
            const pastPoints = [];
            for (let i = 0; i < 90; i += 1) {
                const time = new Date(now.getTime() - i * 60000);
                const pos = satellite.propagate(satrec, time);
                if (!pos || !pos.position) continue;
                const gmst = satellite.gstime(time);
                const posGd = satellite.eciToGeodetic(pos.position, gmst);

                const lat = satellite.degreesLat(posGd.latitude);
                const lon = satellite.degreesLong(posGd.longitude);

                if (pastPoints.length > 0) {
                    const lastLon = pastPoints[pastPoints.length - 1][1];
                    if (Math.abs(lon - lastLon) > 100) break;
                }

                pastPoints.push([lat, lon]);
            }
            pastLine.setLatLngs(pastPoints);

            // extra data derived from the same TLE
            const periodMin = (2 * Math.PI) / satrec.no;
            document.getElementById('period').innerText = periodMin.toFixed(1);
            document.getElementById('incl').innerText = (satrec.inclo * (180 / Math.PI)).toFixed(1);
            document.getElementById('orbits').innerText = (1440 / periodMin).toFixed(1);
        }

        async function update() {
            try {
                const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                const data = await res.json();
                const pos = [data.latitude, data.longitude];

                // Update UI
                document.getElementById('coords').innerText = `${data.latitude.toFixed(3)}°, ${data.longitude.toFixed(3)}°`;
                document.getElementById('speed').innerText = Math.round(data.velocity).toLocaleString();
                document.getElementById('alt').innerText = Math.round(data.altitude);
                document.getElementById('visibility').innerText = (data.visibility || '---').toUpperCase();

                const angRad = Math.acos(EARTH_R / (EARTH_R + data.altitude));
                document.getElementById('footprint').innerText = Math.round(EARTH_R * angRad).toLocaleString();

                marker.setLatLng(pos);

                if (isFirstLoad) {
                    map.setView(pos, 3);
                    isFirstLoad = false;
                }

                const tleRes = await fetch('https://api.wheretheiss.at/v1/satellites/25544/tles');
                const tle = await tleRes.json();
                updatePrediction(tle.line1, tle.line2, data.longitude);

            } catch (e) { console.log("Updating..."); }
        }

        setInterval(update, 2000);
        update();

        // Live view toggle - loads the NASA stream only when opened
        const liveBtn = document.getElementById('liveBtn');
        const liveWrap = document.getElementById('liveWrap');
        let liveLoaded = false;
        let ytPlayer = null;

        function loadYouTubeAPI() {
            return new Promise((resolve) => {
                if (window.YT && window.YT.Player) { resolve(); return; }
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = () => resolve();
            });
        }

        liveBtn.addEventListener('click', () => {
            const open = liveWrap.classList.toggle('open');
            liveBtn.textContent = open ? 'Hide Live View' : 'Live View';
            if (open && !liveLoaded) {
                liveLoaded = true;
                const liveInner = document.getElementById('liveInner');

                // Error 153 usually means YouTube rejected the embed because the
                // page's origin (or file:// with no origin at all) isn't allowed,
                // or the referenced channel has no live stream running right now.
                const isFileProtocol = window.location.protocol === 'file:';
                // NASA's main channel doesn't run a 24/7 broadcast anymore, so
                // embed/live_stream?channel=... often has no active broadcast to
                // redirect to and shows "Video unavailable." NASA instead runs a
                // long-running dedicated ISS live-view video, which is far more
                // reliably embeddable.
                const issLiveVideoId = 'M3HKLzjvKPc';
                const watchUrl = `https://www.youtube.com/watch?v=${issLiveVideoId}`;

                if (isFileProtocol) {
                    // YouTube embeds reliably throw error 153 on file:// pages
                    // (no valid origin to authorize), so skip straight to a link.
                    liveInner.innerHTML =
                        `<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:12px;text-align:center;font-size:12px;">
                            Live view doesn't work when this page is opened directly from a file.<br><br>
                            <a href="${watchUrl}" target="_blank" rel="noopener" style="color:#00e5ff;">Watch ISS Live ↗</a>
                         </div>`;
                    return;
                }

                // Build a bare player div + one custom play/pause button — no
                // YouTube logo, title bar, related videos, or native controls.
                // Notes:
                // - We never call pauseVideo() on the real player — YouTube draws
                //   its own title / "Watch on YouTube" overlay the moment a video
                //   is actually paused, and that can't be suppressed via the API.
                //   "Pause" just covers the video with a blank div while the
                //   (muted) stream keeps playing silently underneath.
                // - A transparent overlay sits on top of the iframe at all times
                //   to intercept every hover/click before it reaches YouTube's
                //   player — that hover is what triggers YouTube's own logo
                //   overlay to appear, so blocking it stops the logo from
                //   showing at all.
                // - YouTube also auto-shows a title card for a few seconds right
                //   after playback starts, regardless of hover. We cover the
                //   video for the first few seconds after it starts to hide that.
                liveInner.innerHTML =
                    `<div id="ytPlayerHost" style="position:absolute;inset:0;"></div>
                     <div id="issPauseCover" style="position:absolute;inset:0;z-index:1;background:#000;display:block;"></div>
                     <div id="issHoverBlock" style="position:absolute;inset:0;z-index:1;background:transparent;cursor:pointer;"></div>
                     <button id="issPlayPause" aria-label="Play/Pause"
                       style="position:absolute;bottom:8px;left:8px;z-index:2;width:34px;height:34px;
                              border-radius:50%;border:1px solid rgba(245,251,252,0.4);
                              background:rgba(11,13,23,0.75);color:#fff;font-size:14px;
                              display:flex;align-items:center;justify-content:center;cursor:pointer;">▶</button>`;

                loadYouTubeAPI().then(() => {
                    ytPlayer = new YT.Player('ytPlayerHost', {
                        videoId: issLiveVideoId,
                        playerVars: {
                            autoplay: 1,
                            mute: 1,
                            controls: 0,       // hide YouTube's own control bar
                            modestbranding: 1,  // minimize the YouTube logo
                            rel: 0,             // no related videos
                            iv_load_policy: 3,  // no annotations
                            fs: 0,              // no fullscreen button
                            disablekb: 1,
                            playsinline: 1,
                            origin: window.location.origin
                        },
                        events: {
                            onReady: (e) => {
                                e.target.playVideo();
                                // Let YouTube's own startup title card finish
                                // showing and fade out underneath our cover
                                // before revealing the video.
                                setTimeout(() => {
                                    const cover = document.getElementById('issPauseCover');
                                    const btn = document.getElementById('issPlayPause');
                                    if (cover) cover.style.display = 'none';
                                    if (btn) btn.textContent = '❚❚';
                                    showingCover = false;
                                }, 4000);
                            },
                            onError: () => {
                                liveInner.innerHTML =
                                    `<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:12px;text-align:center;font-size:12px;">
                                        Live stream unavailable right now.<br><br>
                                        <a href="${watchUrl}" target="_blank" rel="noopener" style="color:#00e5ff;">Watch ISS Live ↗</a>
                                     </div>`;
                            }
                        }
                    });

                    let showingCover = true;
                    const toggle = () => {
                        const cover = document.getElementById('issPauseCover');
                        const btn = document.getElementById('issPlayPause');
                        showingCover = !showingCover;
                        cover.style.display = showingCover ? 'block' : 'none';
                        btn.textContent = showingCover ? '▶' : '❚❚';
                    };
                    document.getElementById('issPlayPause').addEventListener('click', toggle);
                    document.getElementById('issHoverBlock').addEventListener('click', toggle);
                });
            }
        });

        // ISS retirement countdown (kept from the original)
        function updateTimer() {
            const targetDate = new Date("January 1, 2030 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById("iss-timer").innerHTML = "ISS Mission Ended 🚀";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("iss-timer").innerHTML =
              `🚀 ISS Remaining Time<br>${days}d ${hours}h ${minutes}m ${seconds}s`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
